apis:
- name: CENTAURI Management API
  description: >-
    On-device RESTful management API served by each CENTAURI wireless laser device over HTTPS
    with token-based authentication. Used to view and modify device configuration, alignment,
    and monitoring settings. The base URL is device-local (per-appliance, not a public cloud
    endpoint), so no public production host is published.
