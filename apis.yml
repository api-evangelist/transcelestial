aid: transcelestial
name: Transcelestial
description: >-
  Transcelestial is a Singapore-based wireless laser communications company building CENTAURI,
  a line of compact free-space optical (laser) devices that deliver high-speed, low-latency
  connectivity of up to 25 Gbps as a rapid-to-deploy alternative to fiber and RF backhaul.
  CENTAURI links buildings, cell towers, and street-level infrastructure, and the company is
  extending its optical network toward LEO satellites for global inter-continental connectivity.
  Each CENTAURI device exposes an on-device RESTful management API (over HTTPS with token-based
  authentication) alongside SNMP monitoring and a device CLI for configuration and deployment.
